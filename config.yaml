# Raven configuration. Every key below is read by the code (raven/config.py);
# config.tuned.yaml, if present, is loaded instead of this file.
#
# Model / endpoint. The evaluators supply only AI_API_KEY (a DeepSeek or Qwen
# key), so `auto` detects the provider that accepts the key -- a free
# GET /models on each candidate below, in order -- and uses the first of its
# preferred models the key can access (else the best chat/coder model it
# lists). The choice is printed at startup. To pin them instead, replace
# `auto`, or export RAVEN_BASE_URL / RAVEN_MODEL (or RAVEN_PROVIDER=deepseek|qwen).
# The API key is only ever read from the AI_API_KEY environment variable.
llm:
  provider: openai_compatible
  base_url: auto
  model: auto
  providers:
    - name: deepseek
      base_url: https://api.deepseek.com/v1
      models: [deepseek-chat, deepseek-v3, deepseek-coder]
    - name: qwen          # Alibaba Model Studio (DashScope), international
      base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      models: [qwen3-coder-plus, qwen3-coder-flash, qwen-coder-plus, qwen-plus, qwen-max, qwen-turbo]
    - name: qwen-cn       # DashScope, mainland China
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      models: [qwen3-coder-plus, qwen3-coder-flash, qwen-coder-plus, qwen-plus, qwen-max, qwen-turbo]
    - name: openrouter    # only for keys starting sk-or-
      base_url: https://openrouter.ai/api/v1
      key_prefix: sk-or-
      models: [qwen/qwen3-coder, deepseek/deepseek-chat-v3.1, deepseek/deepseek-chat]
    - name: groq          # only for keys starting gsk_
      base_url: https://api.groq.com/openai/v1
      key_prefix: gsk_
      models: [qwen/qwen3-32b, openai/gpt-oss-20b]
  temperature: 0          # reproducibility: deterministic decoding
  seed: 7                 # reproducibility: sent to the endpoint, and seeds retry jitter
  max_output_tokens: 2048
  tool_protocol: auto     # auto (native tool calls, text fallback) | text
  request_timeout_s: 60
  max_retries: 5

executor:
  strategy: crux          # crux | single_loop | plan_execute | delegated
  candidates: 3           # crux: first-round candidate fixes (one call each, run in parallel)
  max_candidates: 5       # crux: cap across the adaptive second round
  parallel_calls: true    # crux: candidate calls run concurrently (latency ~ one call)
  max_iterations: 30      # agent-loop turns (single_loop, and crux's fallback)
  max_replans: 2          # plan_execute / delegated only
  delegate_min_reads: 4   # delegated only: when a plan step goes to the Explorer

context:
  half_life: 3            # turns before an old tool result starts shrinking

recovery:
  stall_turns: 4                        # turns without progress before a nudge
  identical_failures_for_debugger: 3    # same failing tests N times -> roll back + Debugger

verify:
  reproduce: true         # write + independently verify a failing repro test first (plan §11.2)
  trace: true             # execution story + Ochiai fault localisation of the original failure
  behavior_diff: true     # flag behaviour changes outside the intended target

learning:
  in_run_reflection: true
  lessons: true           # retrieve + extract cross-task lessons (stored in the target repo's .raven/)
  max_lessons_pinned: 3

budgets:                  # whole run: every step, replan and sub-agent call
  total_tokens: 400000    # nudge to converge at 80%, stop at 100%
  wall_clock_s: 1200

ui:
  tui: auto   # auto | on | off (falls back to the plain REPL)
